name: CI

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace?schema=public
      REDIS_URL: redis://localhost:6379
      API_PORT: 4012
      API_URL: http://127.0.0.1:4012/api
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4012/api
      NEXT_PUBLIC_BUYER_APP_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_SUPPLIER_APP_URL: http://127.0.0.1:3002
      NEXT_PUBLIC_LANDING_APP_URL: http://127.0.0.1:3003
      DEPLOYMENT_PROFILE: pilot
      AUTH_MODE: development
      INTEGRATION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_SECURITY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SIGNATURE_CALLBACK_SECRET: ci-signature-callback-secret-at-least-32-chars
      OBJECT_STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: .local-storage-ci
      AV_SCAN_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run db:generate
      - run: npm exec --workspace=@marketplace/api -- prisma migrate deploy
      - run: npm run db:seed
      - name: Assert test profile is isolated from pilot data
        run: SEED_PROFILE_ASSERT_NO_PILOT=true npm run db:seed:test
      - name: Prepare deterministic pilot market
        run: |
          node --test scripts/pilot-variant-selection.test.mjs
          npm run catalog:sync-production:apply
          npm run db:seed-pilot
          npm run verify:seed-profiles
      - run: npm exec --workspace=@marketplace/api -- prisma validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:outbound-security
      - run: npm run verify:outbox
      - run: npm run build
      - run: npm run verify:observability
      - run: npm run verify:runtime-split
      - run: npm run verify:pilot-composition
      - run: npm run verify:frontend-profile
      - run: npm run verify:local-profile
      - run: npm run verify:core-contract
      - run: npm run verify:production-config
      - run: npm run verify:production-readiness-contract
      - run: npm run verify:rate-limit-auth
      - run: npm audit --omit=dev --audit-level=high
      - run: docker compose config --quiet
      - name: Prepare legacy fixtures in disposable CI PostgreSQL
        timeout-minutes: 5
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { PrismaClient } from '@prisma/client';
          assert(process.env.GITHUB_ACTIONS === 'true' && process.env.RUNNER_ENVIRONMENT === 'github-hosted', 'Legacy bootstrap requires a GitHub-hosted CI runner');
          let target;
          try { target = new URL(process.env.DATABASE_URL); } catch { throw new Error('Invalid CI database configuration'); }
          assert(target.protocol === 'postgresql:' && target.hostname === 'localhost' && target.port === '5432' && target.pathname === '/marketplace' && target.username === 'marketplace' && target.search === '?schema=public', 'Unexpected CI database target');
          assert(process.env.CI_POSTGRES_CONTAINER, 'Missing job.services.postgres container');
          const [container] = JSON.parse(execFileSync('docker', ['inspect', process.env.CI_POSTGRES_CONTAINER], { encoding: 'utf8' }));
          assert(container.Config.Image === 'postgres:17-alpine' && container.State.Running, 'Unexpected PostgreSQL service');
          assert(!container.HostConfig.Binds?.length && container.Mounts.every(mount => mount.Type === 'volume' && mount.Driver === 'local'), 'CI PostgreSQL must not mount external project data');
          assert(container.NetworkSettings.Ports['5432/tcp']?.some(binding => binding.HostPort === target.port), 'Database port does not belong to the CI service');
          const prisma = new PrismaClient();
          try {
            await prisma.$transaction(async tx => {
              await tx.$executeRawUnsafe('SET TRANSACTION READ ONLY');
              const [identity] = await tx.$queryRaw`SELECT current_database() AS database, current_schema() AS schema`;
              assert(identity.database === 'marketplace' && identity.schema === 'public', 'Unexpected connected CI database/schema');
              const [extension] = await tx.$queryRaw`SELECT 'fixture' % 'fixture' AS visible`;
              assert(extension.visible === true, 'pg_trgm is not visible to the verification connection');
              console.log('Disposable job.services.postgres verified: marketplace/public; pg_trgm visible');
            });
          } finally { await prisma.$disconnect(); }
          NODE
          npm run prisma:seed:legacy --workspace=@marketplace/api
      - name: Extended API verification (explicit go_live)
        timeout-minutes: 10
        env:
          DEPLOYMENT_PROFILE: go_live
          NODE_ENV: test
          PAYMENT_PROVIDER_MODE: mock
          BACKGROUND_QUEUE_ENABLED: "true"
        run: |
          node --test scripts/ci-verification.test.mjs
          node scripts/verify-ci-runtime-readiness.mjs --preflight
          API_PID=
          WORKER_PID=
          cleanup() {
            result=$?
            trap - EXIT
            for pid in $API_PID $WORKER_PID; do kill "$pid" 2>/dev/null || true; done
            for attempt in $(seq 1 10); do
              alive=false
              for pid in $API_PID $WORKER_PID; do if kill -0 "$pid" 2>/dev/null; then alive=true; fi; done
              if [ "$alive" = false ]; then break; fi
              sleep 1
            done
            for pid in $API_PID $WORKER_PID; do
              if kill -0 "$pid" 2>/dev/null; then kill -KILL "$pid" 2>/dev/null || true; fi
              wait "$pid" 2>/dev/null || true
            done
            echo "CI runtime cleanup: owned API and worker stopped"
            cat /tmp/marketplace-api.log /tmp/marketplace-worker.log
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          (cd apps/api && PROCESS_ROLE=api exec node dist/src/main.js) > /tmp/marketplace-api.log 2>&1 &
          API_PID=$!
          (cd apps/api && PROCESS_ROLE=worker exec node dist/src/worker.js) > /tmp/marketplace-worker.log 2>&1 &
          WORKER_PID=$!
          node scripts/verify-ci-runtime-readiness.mjs "$API_PID" "$WORKER_PID" /tmp/marketplace-worker.log
          for gate in search-commerce document-compliance security onboarding-agreement trust-geo; do
            kill -0 "$API_PID"
            kill -0 "$WORKER_PID"
            npm run "verify:$gate"
            kill -0 "$API_PID"
            kill -0 "$WORKER_PID"
          done
      - name: Pilot browser verification
        run: |
          npm run verify:flow-b3
          npm run verify:web
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            /tmp/marketplace-api.log
            /tmp/marketplace-worker.log
            apps/e2e/test-results/
            apps/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:postgres
      - run: npm run verify:platform-authority
      - run: npm run verify:backup-restore
        env:
          POSTGRES_CLIENT_MODE: docker
          RESTORE_DRILL_USE_OBJECT_FIXTURE: "true"
